<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Self-hosted Avenir Next (brand font) — preload key weights -->
    <link rel="preload" as="font" type="font/ttf" href="/fonts/avenir-next/AvenirNext-Regular-08.ttf" crossorigin />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/avenir-next/AvenirNext-DemiBold-03.ttf" crossorigin />
    <link rel="preload" as="font" type="font/ttf" href="/fonts/avenir-next/AvenirNext-Bold-01.ttf" crossorigin />

    <!-- Google Fonts fallback (Barlow Condensed for display fallback, JetBrains Mono for labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" />

    <!-- Preconnect for contact / newsletter form submissions -->
    <link rel="preconnect" href="https://formspree.io" crossorigin />

    <!-- Hero poster — shown immediately while video loads / for reduced-motion users -->
    <link rel="preload" as="image" href="/hero-poster.jpg" />

    <title>inRebus Digital Learning — Creative Outside the Box</title>
    <meta name="description" content="inRebus Digital Learning — Custom e-learning, gamification, digital academies and LMS solutions since 2003. Turin, Italy." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.inrebus.education/" />
    <meta property="og:title"       content="inRebus Digital Learning — Creative Outside the Box" />
    <meta property="og:description" content="Custom e-learning, gamification, digital academies and LMS solutions since 2003. Turin, Italy." />
    <meta property="og:image"       content="https://www.inrebus.education/og.jpg" />
    <meta property="og:image:type"   content="image/jpeg" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name"    content="inRebus Digital Learning" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="inRebus Digital Learning — Creative Outside the Box" />
    <meta name="twitter:description" content="Custom e-learning, gamification, digital academies and LMS solutions since 2003. Turin, Italy." />
    <meta name="twitter:image"       content="https://www.inrebus.education/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
